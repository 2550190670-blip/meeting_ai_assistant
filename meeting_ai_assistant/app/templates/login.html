{% extends "base.html" %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">Private Workspace</p>
  <h1>登录账号</h1>
  <p>请输入账号后进入会议资料库。</p>
  {% if error %}
    <div class="hot-alert" role="alert">
      <strong>登录失败</strong>
      <span>{{ error }}</span>
    </div>
  {% endif %}
  <form class="form-card calm-form" action="/login" method="post">
    <label>
      <span>用户名</span>
      <input name="username" autocomplete="username" required>
    </label>
    <label>
      <span>密码</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="button primary submit-button" type="submit">登录</button>
  </form>
</section>
{% endblock %}
