{% extends "base.html" %}
{% block content %}
<header class="page-title calm-title">
  <a class="circle-button" href="/" title="返回">‹</a>
  <div>
    <p class="eyebrow">New Meeting</p>
    <h1>新建会议</h1>
    <p>上传手机录音，或直接粘贴会议文字。</p>
  </div>
</header>

<form id="meeting-form" class="form-card calm-form" action="/meetings" method="post" enctype="multipart/form-data">
  <input id="native-recording-path" name="native_recording_path" type="hidden" value="{{ native_recording_path or '' }}">
  {% if error %}
    <div class="hot-alert" role="alert">
      <strong>还缺少会议内容</strong>
      <span>{{ error }}</span>
    </div>
  {% endif %}

  <label>
    <span>会议标题</span>
    <input name="title" placeholder="例如：产品周会" value="{{ title or '' }}" required>
  </label>

  <label>
    <span>文件夹</span>
    <input name="folder" list="folder-list" placeholder="默认文件夹" value="{{ folder or '默认文件夹' }}">
    <datalist id="folder-list">
      {% for folder in folders %}
        <option value="{{ folder }}"></option>
      {% endfor %}
    </datalist>
  </label>

  <section class="recorder calm-recorder" aria-label="手机录音">
    <div class="recorder-copy">
      <span class="field-title">现场录音</span>
      <small id="record-status">点击开始后允许麦克风权限，停止后会自动加入上传。</small>
    </div>
    <div class="record-actions">
      <button id="start-record" class="button record-button" type="button">开始录音</button>
      <button id="stop-record" class="button secondary" type="button" disabled>停止</button>
    </div>
    <audio id="record-preview" controls hidden></audio>
  </section>

  <label>
    <span>录音或视频</span>
    <input id="recording-file" class="file-input" name="recording" type="file" accept="audio/*,video/*">
    <small>用户可以先用手机录音，再把音频文件上传到这里。</small>
  </label>

  <label>
    <span>会议文本</span>
    <textarea name="raw_text" rows="10" placeholder="也可以直接粘贴会议记录、语音转文字稿或手写要点。">{{ raw_text or '' }}</textarea>
  </label>

  <button id="submit-button" class="button primary submit-button" type="submit">生成会议纪要</button>
</form>

<div id="loading-overlay" class="loading-overlay" hidden>
  <div class="loading-card">
    <span class="loading-spinner"></span>
    <strong>正在生成会议纪要</strong>
    <p>正在调用模型分析内容，录音文件可能需要更久，请稍等。</p>
  </div>
</div>

<script>
  const meetingForm = document.querySelector("#meeting-form");
  const submitButton = document.querySelector("#submit-button");
  const loadingOverlay = document.querySelector("#loading-overlay");
  const startButton = document.querySelector("#start-record");
  const stopButton = document.querySelector("#stop-record");
  const statusText = document.querySelector("#record-status");
  const preview = document.querySelector("#record-preview");
  const fileInput = document.querySelector("#recording-file");
  const nativeRecordingPath = document.querySelector("#native-recording-path");

  let recorder = null;
  let chunks = [];
  let stream = null;

  meetingForm.addEventListener("submit", () => {
    loadingOverlay.hidden = false;
    submitButton.disabled = true;
    submitButton.textContent = "\u751f\u6210\u4e2d...";
  });

  function setStatus(text) {
    statusText.textContent = text;
  }

  function showNativePreview(path) {
    preview.src = `/recordings/native?path=${encodeURIComponent(path)}`;
    preview.hidden = false;
    preview.load();
  }

  function pickMimeType() {
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
  }

  startButton.addEventListener("click", async () => {
    nativeRecordingPath.value = "";
    preview.hidden = true;
    preview.removeAttribute("src");

    if (window.AndroidRecorder) {
      const result = window.AndroidRecorder.startRecording();
      if (result === "OK") {
        startButton.disabled = true;
        stopButton.disabled = false;
        setStatus("\u6b63\u5728\u5f55\u97f3...");
      } else if (result === "NO_PERMISSION") {
        setStatus("\u8bf7\u5148\u5141\u8bb8\u9ea6\u514b\u98ce\u6743\u9650\uff0c\u7136\u540e\u518d\u70b9\u51fb\u5f00\u59cb\u5f55\u97f3\u3002");
      } else {
        setStatus(`\u539f\u751f\u5f55\u97f3\u542f\u52a8\u5931\u8d25\uff1a${result}`);
      }
      return;
    }

    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setStatus("\u5f53\u524d\u6d4f\u89c8\u5668\u4e0d\u652f\u6301\u76f4\u63a5\u5f55\u97f3\uff0c\u53ef\u4ee5\u5148\u7528\u7cfb\u7edf\u5f55\u97f3\u540e\u4e0a\u4f20\u6587\u4ef6\u3002");
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      const mimeType = pickMimeType();
      recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);

      recorder.addEventListener("dataavailable", (event) => {
        if (event.data.size > 0) chunks.push(event.data);
      });

      recorder.addEventListener("stop", () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        const file = new File([blob], `meeting-recording-${Date.now()}.webm`, { type: blob.type });
        try {
          const files = new DataTransfer();
          files.items.add(file);
          fileInput.files = files.files;
          setStatus("\u5f55\u97f3\u5df2\u51c6\u5907\u597d\uff0c\u53ef\u5148\u64ad\u653e\u786e\u8ba4\uff0c\u63d0\u4ea4\u540e\u4f1a\u81ea\u52a8\u8f6c\u5199\u5e76\u751f\u6210\u7eaa\u8981\u3002");
        } catch (error) {
          setStatus("\u5f55\u97f3\u5df2\u5b8c\u6210\uff0c\u4f46\u5f53\u524d WebView \u4e0d\u80fd\u81ea\u52a8\u52a0\u5165\u4e0a\u4f20\u3002\u8bf7\u4f7f\u7528\u7cfb\u7edf\u5f55\u97f3\u540e\u5728\u4e0b\u65b9\u4e0a\u4f20\u6587\u4ef6\u3002");
        }
        preview.src = URL.createObjectURL(blob);
        preview.hidden = false;
        stream.getTracks().forEach((track) => track.stop());
      });

      recorder.start();
      startButton.disabled = true;
      stopButton.disabled = false;
      setStatus("\u6b63\u5728\u5f55\u97f3...");
    } catch (error) {
      setStatus(`\u65e0\u6cd5\u5f00\u542f\u9ea6\u514b\u98ce\uff1a${error.name || "\u6743\u9650\u6216\u8bbe\u5907\u5f02\u5e38"}\u3002\u8bf7\u786e\u8ba4\u5df2\u5141\u8bb8\u9ea6\u514b\u98ce\u6743\u9650\u3002`);
      startButton.disabled = false;
      stopButton.disabled = true;
    }
  });

  stopButton.addEventListener("click", () => {
    if (window.AndroidRecorder) {
      const result = window.AndroidRecorder.stopRecording();
      startButton.disabled = false;
      stopButton.disabled = true;
      if (result && !result.startsWith("ERROR:")) {
        nativeRecordingPath.value = result;
        fileInput.value = "";
        showNativePreview(result);
        setStatus("\u5f55\u97f3\u5df2\u4fdd\u5b58\uff0c\u53ef\u5148\u64ad\u653e\u786e\u8ba4\uff0c\u63d0\u4ea4\u540e\u4f1a\u81ea\u52a8\u8f6c\u5199\u5e76\u751f\u6210\u7eaa\u8981\u3002");
      } else {
        setStatus(`\u505c\u6b62\u5f55\u97f3\u5931\u8d25\uff1a${result}`);
      }
      return;
    }

    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
      startButton.disabled = false;
      stopButton.disabled = true;
    }
  });
</script>
{% endblock %}
